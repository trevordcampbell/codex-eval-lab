schema_version = 1
name = "deduplication-benchmark"
cases = "cases.jsonl"
repetitions = 2
seed = 42
source_paths = ["app.py"]
harness_paths = ["grader.py"]

[execution]
mode = "local"
app_command = ["{python}", "-S", "{app}/app.py"]
grader_command = ["{python}", "-S", "{suite}/grader.py"]
timeout_s = 10
grader_timeout_s = 10
max_output_bytes = 100000

[metrics.correctness]
minimum = 0.0
maximum = 1.0
[metrics.kernel_ms]
minimum = 0.0
[metrics.cost_usd]
minimum = 0.0

[objective]
metric = "kernel_ms"
direction = "minimize"
min_improvement = 0.001
confidence = 0.95
min_validation_groups = 8
bootstrap_samples = 2000

[[guardrails]]
metric = "correctness"
direction = "maximize"
max_regression = 0.0

[budget]
max_eval_cost_usd = 0.0
trial_reserve_usd = 0.0
max_trials = 1000
max_wall_time_s = 3600
max_optimizer_calls = 3

[search]
editable = ["app.py"]
max_rounds = 3
patience = 2

[optimizer]
backend = "codex"
timeout_s = 600
