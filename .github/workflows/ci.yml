name: Local-contract tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local package
        run: python -m pip install -e .
      - name: Test contracts (no credentials or paid calls)
        run: python -m unittest discover -v
      - name: Verify installable skill references
        run: python scripts/sync_skill_references.py --check
      - name: CLI smoke check
        run: eval-lab doctor
      - name: Offline full-loop demo
        if: matrix.python == '3.13'
        run: python scripts/demo.py --out "$RUNNER_TEMP/eval-lab-demo"
