[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-eval-lab"
version = "0.1.0"
description = "Provider-neutral, evidence-driven evaluation and hillclimbing workflows for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Trevor Campbell"}]
keywords = ["codex", "evals", "agents", "hillclimbing", "evaluation"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.scripts]
eval-lab = "codex_eval_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
